<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRIPLE — One Shot, Three Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a09;
    --ink:#f5f0e8;
    --amber:#ff7a18;
    --amber2:#ffb347;
    --muted:#8a817c;
    --line:rgba(245,240,232,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"DM Mono",monospace}
  #app{height:100dvh;display:flex;flex-direction:column;position:relative}

  /* ---- top bar ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 14px;z-index:6;
  }
  .brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;letter-spacing:-.5px;line-height:1}
  .brand span{color:var(--amber)}
  .tag{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
  .frames{display:flex;gap:6px}
  .chip{font-size:9.5px;letter-spacing:1px;border:1px solid var(--line);border-radius:30px;padding:5px 9px;color:var(--muted);text-transform:uppercase}
  .chip.on{color:var(--bg);background:var(--amber);border-color:var(--amber);font-weight:500}

  /* ---- viewfinder ---- */
  .stage{flex:1;position:relative;overflow:hidden;margin:0 14px;border-radius:26px;border:1px solid var(--line);background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .42s cubic-bezier(.22,1,.36,1)}
  .grid{position:absolute;inset:0;pointer-events:none;opacity:.22}
  .grid::before,.grid::after{content:"";position:absolute;background:#fff}
  .grid::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid #fff;border-right:1px solid #fff;background:none}
  .grid::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px solid #fff;border-bottom:1px solid #fff;background:none}
  .reticle{position:absolute;top:14px;left:14px;font-size:10px;letter-spacing:2px;color:var(--amber2);text-shadow:0 1px 6px #000;z-index:3}
  .rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:middle;animation:blink 1.4s infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
  .flash.go{animation:fl .32s ease-out}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}

  .perm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:4}
  .perm p{color:var(--muted);font-size:12px;line-height:1.7;max-width:240px}
  .perm button{font-family:"DM Mono";background:var(--amber);color:var(--bg);border:none;border-radius:30px;padding:13px 26px;font-size:13px;letter-spacing:1px;font-weight:500}

  /* burst progress dots */
  .burst{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
  .burst i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:.2s}
  .burst i.lit{background:var(--amber);transform:scale(1.3)}

  /* ---- controls ---- */
  .controls{display:flex;align-items:center;justify-content:space-between;padding:22px 34px 30px;z-index:6}
  .side{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
  .roll{width:50px;height:50px;border-radius:13px;border:1px solid var(--line);overflow:hidden;background:#1a1714;position:relative}
  .roll img{width:100%;height:100%;object-fit:cover}
  .roll .badge{position:absolute;top:-6px;right:-6px;background:var(--amber);color:var(--bg);font-size:9px;font-weight:600;border-radius:30px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .flip{background:none;border:1px solid var(--line);color:var(--ink);width:50px;height:50px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}

  .shutter{width:80px;height:80px;border-radius:50%;border:3px solid var(--ink);background:none;display:flex;align-items:center;justify-content:center;position:relative}
  .shutter::after{content:"";width:62px;height:62px;border-radius:50%;background:var(--ink);transition:.16s}
  .shutter:active::after{width:54px;height:54px;background:var(--amber)}
  .shutter.busy{pointer-events:none}
  .shutter.busy::after{background:var(--amber);animation:pulse .5s infinite alternate}
  @keyframes pulse{to{transform:scale(.82)}}
  .shutter .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent}
  .shutter.busy .ring{border-top-color:var(--amber2);animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- gallery ---- */
  .gallery{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .gallery.open{transform:none}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px}
  .ghead h2{font-family:"Bricolage Grotesque";font-weight:700;font-size:19px}
  .ghead .x{background:none;border:none;color:var(--ink);font-size:24px}
  .gscroll{flex:1;overflow-y:auto;padding:0 16px 30px}
  .set{margin-bottom:26px}
  .set .when{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin:0 4px 10px;text-transform:uppercase}
  .trip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cell{position:relative;aspect-ratio:3/4;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
  .cell img{width:100%;height:100%;object-fit:cover}
  .cell .lab{position:absolute;bottom:0;left:0;right:0;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:5px 7px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:var(--amber2)}
  .cell a{position:absolute;top:6px;right:6px;background:rgba(12,10,9,.7);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;text-decoration:none;backdrop-filter:blur(4px)}
  .empty{text-align:center;color:var(--muted);font-size:12px;padding:60px 20px;line-height:1.8}

  /* play button on a stop-motion set header */
  .setrow{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
  .playbtn{display:inline-flex;align-items:center;gap:6px;font-family:"DM Mono";font-size:10px;letter-spacing:1px;text-transform:uppercase;background:var(--amber);color:var(--bg);border:none;border-radius:30px;padding:6px 13px;font-weight:600}

  /* ---- film player ---- */
  .player{position:fixed;inset:0;background:#0c0a09;z-index:40;display:none;flex-direction:column;height:100dvh}
  .player.open{display:flex}
  .phead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 22px 10px;z-index:2}
  .phead h2{font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;color:var(--ink)}
  .phead .x{background:none;border:none;color:var(--ink);font-size:24px}
  .pstage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 14px;border-radius:20px;background:#000}
  .pstage img{max-width:100%;max-height:100%;object-fit:contain}
  .pframe{position:absolute;top:10px;right:12px;font-size:11px;color:var(--amber2);letter-spacing:1px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:30px}
  .pctrl{flex:0 0 auto;padding:14px 22px 24px;display:flex;flex-direction:column;gap:12px}
  .prow{display:flex;align-items:center;justify-content:center;gap:20px}
  .pplay{width:58px;height:58px;border-radius:50%;background:var(--amber);border:none;color:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center}
  .ploop{background:none;border:1px solid var(--line);color:var(--muted);border-radius:30px;padding:8px 13px;font-family:"DM Mono";font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .ploop.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
  .speed{display:flex;flex-direction:column;gap:6px}
  .speed .slab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:1px}
  .speed .slab b{color:var(--amber2);font-weight:600}
  .speed input[type=range]{width:100%;accent-color:var(--amber);height:4px}
  .export{display:flex;gap:10px;justify-content:center}
  .ebtn{flex:1;max-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:"DM Mono";font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:30px;padding:11px 14px;background:none;color:var(--ink);font-weight:500}
  .ebtn.prime{background:var(--amber);border-color:var(--amber);color:var(--bg)}
  .ebtn:disabled{opacity:.4;pointer-events:none}
  .prog{font-size:10px;color:var(--muted);letter-spacing:1px;text-align:center;min-height:14px}

  /* ---- mode toggle ---- */
  .modes{display:flex;gap:6px;justify-content:center;padding:0 14px 10px;z-index:6}
  .mode{flex:0 0 auto;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--line);border-radius:30px;padding:8px 16px;color:var(--muted);background:none;font-family:"DM Mono"}
  .mode.on{color:var(--bg);background:var(--ink);border-color:var(--ink);font-weight:500}

  /* ---- stop-motion strip ---- */
  .smbar{display:none;align-items:center;justify-content:center;gap:14px;padding:0 14px 10px;z-index:6}
  .smbar.show{display:flex}
  .ivl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:1px}
  .ivl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:16px;font-family:"DM Mono"}
  .ivl b{color:var(--amber2);font-size:15px;min-width:54px;text-align:center;font-weight:500}
  .smcount{font-size:11px;color:var(--muted);letter-spacing:1px}
  .smcount b{color:var(--amber);font-weight:600}

  /* big countdown number over viewfinder */
  .cdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}
  .cdown.show{display:flex}
  .cdown span{font-family:"Bricolage Grotesque";font-weight:800;font-size:120px;color:var(--ink);text-shadow:0 4px 30px rgba(0,0,0,.7);animation:pop .6s ease-out}
  @keyframes pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.85}}

  .shutter.rec-on{border-color:var(--amber)}
  .shutter.rec-on::after{background:var(--amber);border-radius:9px;width:34px;height:34px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">TRIP<span>·</span>SHOT</div>
      <div class="tag">one press · three frames</div>
    </div>
    <div class="frames">
      <div class="chip" id="c0">close</div>
      <div class="chip" id="c1">medium</div>
      <div class="chip" id="c2">wide</div>
    </div>
  </header>

  <div class="stage">
    <video id="vid" autoplay playsinline muted></video>
    <div class="grid"></div>
    <div class="reticle"><span class="rec"></span>READY</div>
    <div class="flash" id="flash"></div>
    <div class="burst" id="burst" style="display:none"><i></i><i></i><i></i></div>
    <div class="cdown" id="cdown"><span id="cdnum">3</span></div>
    <div class="perm" id="perm">
      <p>This app needs your camera. Tap to enable, then choose Triple or Stop-Motion.</p>
      <button id="start">Enable Camera</button>
    </div>
  </div>

  <div class="modes">
    <button class="mode on" id="mTriple">Triple</button>
    <button class="mode" id="mStop">Stop-Motion</button>
  </div>

  <div class="smbar" id="smbar">
    <div class="ivl">
      <button id="ivlMinus">−</button>
      <b id="ivlVal">2.0s</b>
      <button id="ivlPlus">+</button>
    </div>
    <div class="smcount">frames <b id="smN">0</b></div>
  </div>

  <div class="controls">
    <div class="side">
      <div class="roll" id="roll" style="display:none">
        <img id="rollimg" alt="">
        <span class="badge" id="badge">0</span>
      </div>
    </div>
    <button class="shutter" id="shutter"><span class="ring"></span></button>
    <button class="flip" id="flip">⟲</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="ghead">
      <h2>The Roll</h2>
      <button class="x" id="close">✕</button>
    </div>
    <div class="gscroll" id="gscroll">
      <div class="empty">No shots yet.<br>Press the shutter to capture a triple.</div>
    </div>
  </div>
</div>

<div class="player" id="player">
  <div class="phead">
    <h2 id="ptitle">Stop-Motion Film</h2>
    <button class="x" id="pclose">✕</button>
  </div>
  <div class="pstage">
    <img id="pimg" alt="">
    <div class="pframe" id="pframe">1 / 1</div>
  </div>
  <div class="pctrl">
    <div class="speed">
      <div class="slab"><span>SPEED</span><b id="fpsval">8 fps</b></div>
      <input type="range" id="fps" min="1" max="24" value="8" step="1">
    </div>
    <div class="prow">
      <button class="ploop on" id="ploop">Loop</button>
      <button class="pplay" id="pplay">▶</button>
      <button class="ploop" id="prestart">⟲ Start</button>
    </div>
    <div class="export">
      <button class="ebtn" id="pdl">↓ Save to Files</button>
      <button class="ebtn prime" id="pshr">↑ Save to Photos / Share</button>
    </div>
    <div class="prog" id="prog"></div>
  </div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
const vid=document.getElementById('vid'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const shutter=document.getElementById('shutter'),flash=document.getElementById('flash');
const perm=document.getElementById('perm'),startBtn=document.getElementById('start');
const burst=document.getElementById('burst'),burstDots=burst.querySelectorAll('i');
const chips=[document.getElementById('c0'),document.getElementById('c1'),document.getElementById('c2')];
const roll=document.getElementById('roll'),rollimg=document.getElementById('rollimg'),badge=document.getElementById('badge');
const gallery=document.getElementById('gallery'),gscroll=document.getElementById('gscroll');
const cdown=document.getElementById('cdown'),cdnum=document.getElementById('cdnum');
const mTriple=document.getElementById('mTriple'),mStop=document.getElementById('mStop'),smbar=document.getElementById('smbar');
const ivlVal=document.getElementById('ivlVal'),ivlMinus=document.getElementById('ivlMinus'),ivlPlus=document.getElementById('ivlPlus'),smN=document.getElementById('smN');

let stream=null, facing='environment', sets=[], shotCount=0;
let mode='triple';                 // 'triple' | 'stop'
let interval=2.0;                  // seconds between stop-motion frames
let smRunning=false, smTimer=null, smShots=[], smTakenCount=0;
const FRAMES=[{name:'close',zoom:2.4},{name:'medium',zoom:1.5},{name:'wide',zoom:1.0}];

/* ---- sound: rising tick that ramps up to each shot, then a high snap ---- */
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq,dur,vol){
  try{
    const a=audio(), o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol,a.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const tick =()=>beep(660,0.09,0.18);   // run-up tick
const tock =()=>beep(880,0.09,0.22);   // last tick before shot
const snap =()=>beep(1320,0.16,0.30);  // the moment of capture

function showPerm(msg){
  perm.style.display='flex';
  perm.querySelector('p').textContent=msg;
  startBtn.textContent='Enable Camera';
  startBtn.disabled=false;
}

async function openCam(){
  // 1. API availability check (fails in insecure / sandboxed contexts)
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showPerm('This browser/preview can’t access the camera here. Open the downloaded file directly in Safari or Chrome on your phone (camera needs a secure https or local page).');
    return;
  }
  startBtn.disabled=true; startBtn.textContent='Starting…';
  if(stream) stream.getTracks().forEach(t=>t.stop());

  // try requested camera, then fall back to ANY camera
  const attempts=[
    {video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false},
    {video:{facingMode:facing},audio:false},
    {video:true,audio:false}
  ];
  let lastErr=null;
  for(const c of attempts){
    try{
      stream=await navigator.mediaDevices.getUserMedia(c);
      vid.srcObject=stream;
      await vid.play().catch(()=>{});
      perm.style.display='none';
      startBtn.disabled=false; startBtn.textContent='Enable Camera';
      return;
    }catch(e){ lastErr=e; }
  }

  // all attempts failed — explain why
  const n=lastErr&&lastErr.name;
  let msg='Couldn’t start the camera.';
  if(n==='NotAllowedError'||n==='SecurityError') msg='Camera permission was denied. Tap the address-bar camera icon (or Settings) to allow it, then tap Enable.';
  else if(n==='NotFoundError'||n==='OverconstrainedError') msg='No camera found on this device.';
  else if(n==='NotReadableError') msg='Camera is in use by another app. Close it and tap Enable.';
  showPerm(msg);
}
startBtn.onclick=openCam;
startBtn.addEventListener('touchend',e=>{e.preventDefault();openCam();},{passive:false});

function setZoom(z){ vid.style.transform=`scale(${z})`; }

function capture(zoom){
  const vw=vid.videoWidth, vh=vid.videoHeight;
  // crop the center region corresponding to the zoom level (3:4 portrait out)
  const outW=900, outH=1200;
  cv.width=outW; cv.height=outH;
  const srcAR=vw/vh, dstAR=outW/outH;
  let cw=vw, ch=vh;
  if(srcAR>dstAR){ cw=vh*dstAR; } else { ch=vw/dstAR; }
  cw/=zoom; ch/=zoom;
  const sx=(vw-cw)/2, sy=(vh-ch)/2;
  if(facing==='user'){ ctx.save(); ctx.translate(outW,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,sx,sy,cw,ch,0,0,outW,outH);
  if(facing==='user') ctx.restore();
  return cv.toDataURL('image/jpeg',0.9);
}

async function fireBurst(){
  if(!stream) return;
  shutter.classList.add('busy');
  burst.style.display='flex';
  const out=[];
  for(let i=0;i<FRAMES.length;i++){
    const f=FRAMES[i];
    setZoom(f.zoom);
    chips.forEach((c,j)=>c.classList.toggle('on',j===i));
    burstDots.forEach((d,j)=>d.classList.toggle('lit',j===i));
    await wait(420);              // let the zoom transition settle
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    if(navigator.vibrate) navigator.vibrate(35);
    out.push({label:f.name, data:capture(f.zoom)});
    await wait(230);
  }
  // reset
  setZoom(1); chips.forEach(c=>c.classList.remove('on'));
  burstDots.forEach(d=>d.classList.remove('lit'));
  burst.style.display='none';
  shutter.classList.remove('busy');
  sets.unshift({when:new Date(), shots:out});
  shotCount+=3;
  updateRoll();
  renderGallery();
}
shutter.onclick=()=>{
  if(!stream) return;
  audio();                       // unlock audio on user gesture
  if(mode==='triple') fireBurst();
  else toggleStopMotion();
};

/* ---- mode switching ---- */
function setMode(m){
  if(smRunning) stopStopMotion();
  mode=m;
  mTriple.classList.toggle('on',m==='triple');
  mStop.classList.toggle('on',m==='stop');
  smbar.classList.toggle('show',m==='stop');
  document.querySelector('.frames').style.visibility = m==='triple'?'visible':'hidden';
  document.querySelector('.tag').textContent = m==='triple' ? 'one press · three frames' : 'move · stop · snap';
}
mTriple.onclick=()=>setMode('triple');
mStop.onclick=()=>setMode('stop');

/* ---- interval picker ---- */
function fmtIvl(){ ivlVal.textContent=interval.toFixed(1)+'s'; }
ivlMinus.onclick=()=>{ interval=Math.max(0.5, +(interval-0.5).toFixed(1)); fmtIvl(); };
ivlPlus.onclick =()=>{ interval=Math.min(10, +(interval+0.5).toFixed(1)); fmtIvl(); };

/* ---- stop-motion engine ---- */
function toggleStopMotion(){ smRunning ? stopStopMotion() : startStopMotion(); }

function startStopMotion(){
  smRunning=true; smShots=[]; smTakenCount=0; smN.textContent='0';
  shutter.classList.add('rec-on');
  scheduleNextFrame();
}

function stopStopMotion(){
  smRunning=false;
  clearTimeout(smTimer);
  cdown.classList.remove('show');
  shutter.classList.remove('rec-on');
  // save whatever was captured as one sequence
  if(smShots.length){
    sets.unshift({when:new Date(), kind:'stop', shots:smShots.slice()});
    shotCount+=smShots.length;
    updateRoll(); renderGallery();
  }
}

// Plan: countdown ticks during the interval, snap at zero, repeat.
function scheduleNextFrame(){
  if(!smRunning) return;
  const total=interval;                       // seconds until this shot
  // how many whole-second ticks fit (cap at 3 so short intervals still beep)
  let ticks=Math.min(3, Math.max(1, Math.round(total)));
  const gap=total/ticks;                      // time between ticks
  let i=ticks;

  const doTick=()=>{
    if(!smRunning) return;
    cdnum.textContent=i;
    cdown.classList.remove('show'); void cdown.offsetWidth; cdown.classList.add('show');
    if(i===1) tock(); else tick();
    if(navigator.vibrate) navigator.vibrate(15);
    i--;
    if(i>=1){
      smTimer=setTimeout(doTick, gap*1000);
    }else{
      smTimer=setTimeout(()=>{
        if(!smRunning) return;
        cdown.classList.remove('show');
        takeStopFrame();
        scheduleNextFrame();           // loop
      }, gap*1000);
    }
  };
  doTick();
}

function takeStopFrame(){
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  snap();
  if(navigator.vibrate) navigator.vibrate(45);
  smShots.push({label:'#'+(smTakenCount+1), data:capture(1)});
  smTakenCount++;
  smN.textContent=smTakenCount;
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

function updateRoll(){
  if(!sets.length) return;
  roll.style.display='block';
  rollimg.src=sets[0].shots[0].data;
  badge.textContent=shotCount;
}

function renderGallery(){
  if(!sets.length){ return; }
  gscroll.innerHTML='';
  sets.forEach((s,idx)=>{
    const t=s.when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const tag = s.kind==='stop' ? `stop-motion · ${s.shots.length} frames` : 'triple';
    const block=document.createElement('div'); block.className='set';
    const playBtn = (s.kind==='stop' && s.shots.length>1)
      ? `<button class="playbtn" data-play="${idx}">▶ Play film</button>` : '';
    block.innerHTML=`<div class="setrow"><div class="when">${t} — ${tag}</div>${playBtn}</div><div class="trip">`+
      s.shots.map((sh,i)=>`<div class="cell"><img src="${sh.data}"><a href="${sh.data}" download="tripshot-${(s.kind==='stop'?'frame'+(i+1):sh.label)}-${Date.now()}.jpg">↓</a><div class="lab">${sh.label}</div></div>`).join('')
      +`</div>`;
    gscroll.appendChild(block);
  });
  gscroll.querySelectorAll('[data-play]').forEach(b=>{
    b.onclick=()=>openPlayer(sets[+b.dataset.play]);
  });
}

roll.onclick=()=>gallery.classList.add('open');
document.getElementById('close').onclick=()=>gallery.classList.remove('open');
document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';openCam();};

/* ---- film player ---- */
const player=document.getElementById('player'),pimg=document.getElementById('pimg');
const pframe=document.getElementById('pframe'),ptitle=document.getElementById('ptitle');
const pplay=document.getElementById('pplay'),prestart=document.getElementById('prestart');
const ploop=document.getElementById('ploop'),fps=document.getElementById('fps'),fpsval=document.getElementById('fpsval');
let pShots=[], pIdx=0, pPlaying=false, pTimer=null, pLoop=true;

function openPlayer(set){
  pShots=set.shots; pIdx=0; pLoop=true; ploop.classList.add('on');
  ptitle.textContent=`Stop-Motion · ${pShots.length} frames`;
  showFrame(0);
  player.classList.add('open');
  startPlay();
}
function closePlayer(){ stopPlay(); player.classList.remove('open'); }

function showFrame(i){
  pIdx=i; pimg.src=pShots[i].data;
  pframe.textContent=`${i+1} / ${pShots.length}`;
}

function step(){
  let next=pIdx+1;
  if(next>=pShots.length){
    if(pLoop){ next=0; }
    else { stopPlay(); return; }
  }
  showFrame(next);
}

function startPlay(){
  pPlaying=true; pplay.textContent='❚❚';
  clearInterval(pTimer);
  const delay=1000/(+fps.value);
  pTimer=setInterval(step, delay);
}
function stopPlay(){
  pPlaying=false; pplay.textContent='▶';
  clearInterval(pTimer);
}

pplay.onclick=()=>{
  if(pPlaying){ stopPlay(); return; }
  if(pIdx>=pShots.length-1 && !pLoop) showFrame(0);
  startPlay();
};
prestart.onclick=()=>{ showFrame(0); startPlay(); };
ploop.onclick=()=>{ pLoop=!pLoop; ploop.classList.toggle('on',pLoop); };
fps.oninput=()=>{ fpsval.textContent=fps.value+' fps'; if(pPlaying) startPlay(); };
document.getElementById('pclose').onclick=closePlayer;

/* ---- GIF export ---- */
const pdl=document.getElementById('pdl'), pshr=document.getElementById('pshr'), prog=document.getElementById('prog');

function buildGif(onDone){
  stopPlay();
  pdl.disabled=true; pshr.disabled=true;
  prog.textContent='Building GIF… 0%';
  const delay=Math.round(1000/(+fps.value));
  // draw each frame onto an offscreen canvas at a reasonable size
  const SIZE=480;
  const oc=document.createElement('canvas'); oc.width=SIZE; oc.height=SIZE;
  const ox=oc.getContext('2d');
  const g=new GIF({workers:2,quality:8,width:SIZE,height:SIZE,workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});
  let loaded=0;
  pShots.forEach(sh=>{
    const img=new Image();
    img.onload=()=>{
      // fit image into square canvas centred
      const scale=Math.min(SIZE/img.width,SIZE/img.height);
      const w=img.width*scale, h=img.height*scale;
      ox.fillStyle='#000'; ox.fillRect(0,0,SIZE,SIZE);
      ox.drawImage(img,(SIZE-w)/2,(SIZE-h)/2,w,h);
      // clone the canvas for this frame (gif.js needs snapshot)
      const fc=document.createElement('canvas'); fc.width=SIZE; fc.height=SIZE;
      fc.getContext('2d').drawImage(oc,0,0);
      g.addFrame(fc,{delay});
      loaded++;
      if(loaded===pShots.length) g.render();
    };
    img.src=sh.data;
  });
  g.on('progress',p=>{ prog.textContent=`Building GIF… ${Math.round(p*100)}%`; });
  g.on('finished',blob=>{
    prog.textContent=''; pdl.disabled=false; pshr.disabled=false;
    onDone(blob);
  });
}

pdl.onclick=()=>{
  buildGif(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='stopmotion-'+Date.now()+'.gif';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    prog.textContent='Saved to Files app. Tip: use Share → Save to Photos for Camera Roll.';
  });
};

pshr.onclick=()=>{
  if(!navigator.share && !navigator.canShare){
    prog.textContent='Sharing not supported in this browser. Try Chrome or Safari.'; return;
  }
  buildGif(async blob=>{
    const file=new File([blob],'stopmotion.gif',{type:'image/gif'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'My Stop-Motion Film'});
        prog.textContent='Tip: choose "Save to Photos" to add it to your Camera Roll.';
      } else {
        await navigator.share({title:'My Stop-Motion Film',text:'Check out my stop-motion!'});
      }
    }catch(e){ if(e.name!=='AbortError') prog.textContent='Share failed: '+e.message; }
  });
};

fmtIvl();
